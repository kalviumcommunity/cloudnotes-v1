# Alternative to systemd: `restart: always` is the container equivalent of
# Restart=always + systemctl enable (restarts on crash and when Docker starts on boot).
#   cp .env.example .env   # then edit values
#   docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: cloudnotes
      POSTGRES_USER: cloudnotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnotes"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cloudnotes:${POSTGRES_PASSWORD}@db:5432/cloudnotes
      UPLOAD_FOLDER: /app/uploads
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
