apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudnotes
  labels:
    app: cloudnotes

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: cloudnotes

  template:
    metadata:
      labels:
        app: cloudnotes

    spec:
      containers:
        - name: cloudnotes
          image: localhost:5000/cloudnotes:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudnotes-database-url
                  key: DATABASE_URL
          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
